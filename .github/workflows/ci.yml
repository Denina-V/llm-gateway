name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the current release. Testing only one of them means
        # finding out about the other from a user.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,anthropic]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q --cov=gateway --cov-report=term-missing --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t llm-gateway:ci .

      # A green unit-test suite says nothing about whether the image starts, so
      # boot it and require real answers out of the running container.
      - name: Boot the container and check it serves
        run: |
          docker run -d --name gw -p 8080:8080 llm-gateway:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz > /dev/null && break
            sleep 1
          done

          curl -sf http://localhost:8080/healthz | tee /dev/stderr | grep -q '"status"'
          curl -sf http://localhost:8080/readyz  | tee /dev/stderr | grep -q '"ready": *true'

          # Serve a real request before scraping. A labelled Prometheus counter
          # that has never been incremented may not be exported at all, so
          # asserting on a cold /metrics tests the client library's rendering
          # rather than the gateway -- and does it differently per version.
          curl -sf -X POST http://localhost:8080/v1/completions \
            -H 'Authorization: Bearer sk-local-research' \
            -H 'Content-Type: application/json' \
            -d '{"model":"mock-small","messages":[{"role":"user","content":"ci smoke test"}]}' \
            | tee /dev/stderr | grep -q '"content"'

          curl -sf http://localhost:8080/metrics \
            | grep -E 'gateway_requests_total\{.*outcome="ok".*\} 1' \
            || { echo "the completion did not register in /metrics"; exit 1; }

      - name: Container logs on failure
        if: failure()
        run: docker logs gw

      - name: Stop the container
        if: always()
        run: docker rm -f gw || true
