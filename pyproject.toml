[project]
name = "llm-gateway"
version = "1.0.0"
description = "Policy, cost control and failure handling in front of an LLM provider."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The Anthropic SDK is optional: a mock-provider deployment (the default, and
# what CI runs) needs no vendor SDK at all.
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = [
    # FastAPI's dependency injection is *expressed* as a call in an argument
    # default -- `key: ApiKey = Depends(authenticate)`. B008 exists to catch
    # accidental shared mutable defaults; here the call is the framework's
    # documented interface, so the rule is a false positive rather than a
    # finding worth working around.
    "B008",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
